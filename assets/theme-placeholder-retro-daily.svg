<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <defs>
    <linearGradient id="retroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="50%" stop-color="#ebe2d5"/>
      <stop offset="100%" stop-color="#e2d6c5"/>
    </linearGradient>
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="360" height="190" fill="url(#retroBg)"/>

  <!-- Subtle horizontal woodgrain texture lines -->
  <line x1="0" y1="35" x2="360" y2="35" stroke="#dacbb8" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="75" x2="360" y2="75" stroke="#dacbb8" stroke-width="1.2" opacity="0.3"/>
  <line x1="0" y1="120" x2="360" y2="120" stroke="#dacbb8" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="165" x2="360" y2="165" stroke="#dacbb8" stroke-width="1" opacity="0.3"/>

  <!-- Light beam down from UFO -->
  <polygon points="270,42 225,185 315,185" fill="url(#beamGradient)"/>

  <!-- Retro UFO Flying Saucer -->
  <g transform="translate(270, 32)">
    <!-- Cockpit dome -->
    <ellipse cx="0" cy="-6" rx="16" ry="12" fill="#b0bec5"/>
    <ellipse cx="0" cy="-6" rx="14" ry="10" fill="#cfd8dc"/>
    <ellipse cx="-4" cy="-9" rx="5" ry="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Alien peek -->
    <ellipse cx="0" cy="-4" rx="4" ry="4" fill="#66bb6a"/>
    <circle cx="-1.5" cy="-4.5" r="1" fill="#000"/>
    <circle cx="1.5" cy="-4.5" r="1" fill="#000"/>

    <!-- Main saucer body -->
    <ellipse cx="0" cy="5" rx="42" ry="11" fill="#263238"/>
    <ellipse cx="0" cy="4" rx="38" ry="9" fill="#455a64"/>
    <ellipse cx="0" cy="3" rx="36" ry="7" fill="#78909c"/>

    <!-- Glowing Saucer Rim Lights -->
    <circle cx="-26" cy="4" r="2.5" fill="#ffd54f"/>
    <circle cx="-13" cy="6" r="2.5" fill="#4dd0e1"/>
    <circle cx="0" cy="7" r="2.5" fill="#ffd54f"/>
    <circle cx="13" cy="6" r="2.5" fill="#4dd0e1"/>
    <circle cx="26" cy="4" r="2.5" fill="#ffd54f"/>

    <!-- Bottom thruster emitter -->
    <ellipse cx="0" cy="9" rx="14" ry="4" fill="#37474f"/>
    <ellipse cx="0" cy="9" rx="10" ry="2.5" fill="#80deea"/>
  </g>

  <!-- Red pop art puff clouds being beamed up -->
  <!-- Cloud 1 (high) -->
  <g transform="translate(268, 80)">
    <path d="M -12,4 Q -16,-6 -6,-10 Q 0,-14 8,-8 Q 16,-6 14,4 Q 18,12 8,14 Q -4,16 -12,4 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
    <path d="M -6,-2 Q -2,-6 4,-4" stroke="#ff8a80" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Cloud 2 (mid) -->
  <g transform="translate(272, 118)">
    <path d="M -16,5 Q -22,-8 -8,-14 Q 0,-18 12,-10 Q 22,-8 20,5 Q 24,16 10,18 Q -4,22 -16,5 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2.5"/>
    <path d="M -8,-3 Q -2,-8 6,-5" stroke="#ff8a80" stroke-width="2" fill="none"/>
  </g>

  <!-- Cloud 3 (low) -->
  <g transform="translate(266, 160)">
    <path d="M -22,6 Q -30,-10 -12,-18 Q 0,-24 16,-14 Q 30,-10 26,6 Q 32,22 14,24 Q -6,28 -22,6 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2.5"/>
    <path d="M -10,-4 Q -3,-10 8,-6" stroke="#ff8a80" stroke-width="2" fill="none"/>
  </g>
</svg>
