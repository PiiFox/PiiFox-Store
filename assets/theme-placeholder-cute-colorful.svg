<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <defs>
    <linearGradient id="pinkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="40%" stop-color="#ffccd5"/>
      <stop offset="100%" stop-color="#ffa6b9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e91e63" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="360" height="190" fill="url(#pinkBg)"/>
  
  <!-- Floating hearts and sparkles -->
  <g opacity="0.85">
    <path d="M 230 45 Q 230 35 238 35 Q 245 35 248 42 Q 251 35 258 35 Q 266 35 266 45 Q 266 58 248 70 Q 230 58 230 45 Z" fill="#ff4081"/>
    <path d="M 215 80 Q 215 73 220 73 Q 225 73 227 78 Q 229 73 234 73 Q 239 73 239 80 Q 239 89 227 98 Q 215 89 215 80 Z" fill="#e91e63" opacity="0.7"/>
    <path d="M 330 30 Q 330 25 334 25 Q 338 25 339 29 Q 340 25 344 25 Q 348 25 348 30 Q 348 37 339 44 Q 330 37 330 30 Z" fill="#ff4081" opacity="0.6"/>
    <!-- Sparkle star -->
    <path d="M 320 65 L 322 72 L 329 74 L 322 76 L 320 83 L 318 76 L 311 74 L 318 72 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="205" cy="55" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="335" cy="100" r="4" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Cute puppy character on the right -->
  <g transform="translate(235, 35)" filter="url(#softGlow)">
    <!-- Fluffy ears -->
    <ellipse cx="28" cy="62" rx="22" ry="34" fill="#fff5ea" transform="rotate(-15 28 62)"/>
    <ellipse cx="92" cy="62" rx="22" ry="34" fill="#fff5ea" transform="rotate(15 92 62)"/>
    <ellipse cx="28" cy="66" rx="14" ry="24" fill="#ffe2dc" transform="rotate(-15 28 66)"/>
    <ellipse cx="92" cy="66" rx="14" ry="24" fill="#ffe2dc" transform="rotate(15 92 66)"/>
    
    <!-- Party cone hat -->
    <polygon points="60,2 45,38 75,38" fill="#4dd0e1"/>
    <polygon points="60,2 52,38 68,38" fill="#ffd54f"/>
    <circle cx="60" cy="2" r="5" fill="#ff4081"/>

    <!-- Head -->
    <ellipse cx="60" cy="72" rx="36" ry="34" fill="#fffdfa"/>
    <ellipse cx="60" cy="72" rx="34" ry="32" fill="#fff8f0"/>

    <!-- Left eye (heart eye) -->
    <path d="M 44 65 Q 44 57 49 57 Q 53 57 55 61 Q 57 57 61 57 Q 66 57 66 65 Q 66 73 55 81 Q 44 73 44 65 Z" fill="#e91e63"/>
    
    <!-- Right eye (sparkling anime eye) -->
    <ellipse cx="76" cy="66" rx="5" ry="6" fill="#2d132c"/>
    <circle cx="74" cy="64" r="2" fill="#ffffff"/>
    <circle cx="78" cy="68" r="1" fill="#ffffff"/>

    <!-- Button nose and mouth -->
    <ellipse cx="62" cy="76" rx="4" ry="3" fill="#4a154b"/>
    <path d="M 58 80 Q 62 84 66 80" stroke="#4a154b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Pink blush cheeks -->
    <ellipse cx="40" cy="74" rx="7" ry="4" fill="#ff80ab" opacity="0.6"/>
    <ellipse cx="82" cy="74" rx="7" ry="4" fill="#ff80ab" opacity="0.6"/>

    <!-- Red big festive ribbon bow -->
    <g transform="translate(60, 104)">
      <path d="M -4 0 C -18 -16 -34 -6 -34 6 C -34 16 -16 16 -4 2 Z" fill="#d81b60"/>
      <path d="M 4 0 C 18 -16 34 -6 34 6 C 34 16 16 16 4 2 Z" fill="#d81b60"/>
      <!-- Ribbon tails -->
      <path d="M -6 4 C -12 18 -18 36 -28 42 C -24 32 -18 20 -4 8 Z" fill="#c2185b"/>
      <path d="M 6 4 C 12 18 18 36 28 42 C 24 32 18 20 4 8 Z" fill="#c2185b"/>
      <!-- Center knot -->
      <circle cx="0" cy="2" r="6" fill="#ad1457"/>
      <circle cx="0" cy="2" r="3" fill="#f06292"/>
    </g>

    <!-- Fluffy paws -->
    <ellipse cx="32" cy="115" rx="12" ry="10" fill="#fffdfa"/>
    <circle cx="28" cy="112" r="2" fill="#ff80ab"/>
    <circle cx="32" cy="110" r="2" fill="#ff80ab"/>
    <circle cx="36" cy="112" r="2" fill="#ff80ab"/>
    <circle cx="32" cy="116" r="3.5" fill="#ff80ab"/>
  </g>
</svg>
